# codex-memoryd provider configuration (example).
#
# This is the DAEMON's own config (~/.codex-memoryd/config.toml). It is NOT the
# Codex-side [memories] block — that lives in ~/.codex/config.toml and selects
# this daemon via `backend = "provider"` / `provider = "codex_memoryd"` /
# `provider_url`. See README.md "How the Codex fork calls it" and SPEC.md §11.1.
#
# Resolution order (later wins):
#   built-in defaults  ->  this file  ->  environment variables  ->  CLI flags
#
# Default config path:   ~/.codex-memoryd/config.toml
# Default storage path:  ~/.codex-memoryd/memory.db
# Default bind:          127.0.0.1:8787
#
# Environment overrides:
#   CODEX_MEMORYD_BIND, CODEX_MEMORYD_DB, CODEX_MEMORYD_PROFILE,
#   CODEX_MEMORYD_WORKSPACE, CODEX_MEMORYD_LOG
#   CODEX_MEMORYD_DREAM_SCHEDULER_ENABLED,
#   CODEX_MEMORYD_DREAM_SCHEDULER_INTERVAL_SECONDS,
#   CODEX_MEMORYD_DREAM_IDLE_WINDOW_SECONDS,
#   CODEX_MEMORYD_DREAM_MIN_SESSION_AGE_SECONDS,
#   CODEX_MEMORYD_DREAM_MIN_TURN_COUNT,
#   CODEX_MEMORYD_DREAM_MAX_BATCH_SIZE,
#   CODEX_MEMORYD_DREAM_MAX_CANDIDATES,
#   CODEX_MEMORYD_DREAM_MAX_RUNTIME_SECONDS
#   CODEX_MEMORYD_PROVIDER_ENABLED, CODEX_MEMORYD_PROVIDER_ADAPTER,
#   CODEX_MEMORYD_PROVIDER_ENDPOINT, CODEX_MEMORYD_PROVIDER_API_KEY,
#   CODEX_MEMORYD_PROVIDER_MODEL, CODEX_MEMORYD_PROVIDER_NAME,
#   CODEX_MEMORYD_PROVIDER_TIMEOUT_SECONDS,
#   CODEX_MEMORYD_PROVIDER_MAX_RESPONSE_BYTES,
#   CODEX_MEMORYD_PROVIDER_COST_PER_1K_INPUT_MICROS,
#   CODEX_MEMORYD_PROVIDER_COST_PER_1K_OUTPUT_MICROS,
#   CODEX_MEMORYD_PROVIDER_DAILY_COST_CEILING_MICROS

[server]
# Loopback-only by default. For Docker, bind 0.0.0.0 inside the container only
# when the host publishes 127.0.0.1:8787:8787. Non-loopback /v1 exposure has no
# built-in auth yet and is unsupported for production remote use.
bind = "127.0.0.1:8787"

[runtime.adjacent]
# Optional local dogfood lane for a second app that sits beside codex-memoryd.
# Disabled by default and config-file only: lifecycle commands still manage only
# codex-memoryd. When enabled, set a distinct local endpoint so status/paths can
# report ownership and detect conflicts with the memory daemon front door.
enabled = false
name = "adjacent-app"
# url = "http://127.0.0.1:4318"

[storage]
# Only "sqlite" is supported in the MVP. A `~` is expanded to the home dir.
kind = "sqlite"
path = "~/.codex-memoryd/memory.db"

[policy]
# Applied when a request omits the profile. Must be one of:
# personal | work | oss | homelab
default_profile = "personal"
# Applied when a request omits the workspace.
default_workspace = "default"
# Cross-profile export posture. MVP is default_deny (work -> personal denied).
cross_profile_policy = "default_deny"

[recall]
# Default token budget for /v1/recall when the request omits max_tokens.
max_tokens = 1200
# Maximum characters stored per memory record; longer content is truncated.
max_record_chars = 8000

[recall.hybrid]
# Disabled by default. Local-only sparse-hash prototype for fixture evals.
enabled = false
backend = "local_sparse_hash"
dims = 64
fusion_k = 60

[dream]
# Off by default. For Docker Compose dogfood, set
# CODEX_MEMORYD_DREAM_SCHEDULER_ENABLED=1 before `docker compose up`.
scheduler_enabled = false
scheduler_interval_seconds = 900
idle_window_seconds = 300
min_session_age_seconds = 60
min_turn_count = 2
max_batch_size = 500
max_candidates = 50
max_runtime_seconds = 30
# Optional typed model-backed preview adapter. Credentials are runtime-only;
# keep CODEX_MEMORYD_PROVIDER_API_KEY out of this file and job data.
provider_enabled = false
provider_adapter = "provider" # deterministic | local-model | provider
# provider_endpoint = "http://127.0.0.1:8080/v1"
# provider_model = "local-runtime"
# provider_name = "openai-compatible"
provider_timeout_seconds = 10
provider_max_response_bytes = 262144
# Costs are integer micros per 1,000 tokens.
provider_cost_per_1k_input_micros = 0
provider_cost_per_1k_output_micros = 0
# provider_daily_cost_ceiling_micros = 1000000

[log]
# error | warn | info | debug | trace
level = "info"
# text | json
format = "text"
